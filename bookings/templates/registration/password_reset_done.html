<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - BookMySeat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        .icon { font-size: 50px; color: #2ecc71; margin-bottom: 15px; }
        h2 { color: #2c3e50; margin-bottom: 12px; }
        p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 25px; }
        .btn-home { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📩</div>
        <h2>Check Your Inbox</h2>
        <p>We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive it shortly.</p>
        <a href="{% url 'login' %}" class="btn-home">Return to Log In</a>
    </div>

</body>
</html>
