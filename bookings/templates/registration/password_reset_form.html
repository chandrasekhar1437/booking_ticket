<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BookMySeat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #e74c3c; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-submit:hover { background-color: #c0392b; }
        .back-link { display: inline-block; margin-top: 15px; font-size: 13px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your registered email address below, and we'll send you a link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">← Back to Log In</a>
    </div>

</body>
</html>
